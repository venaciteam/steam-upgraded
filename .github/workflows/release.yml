# Publication d'une version : compile le plugin (.star) et l'installeur Windows sur Windows, puis l'installeur Mac sur Mac
# avec ce même .star (starlight n'a pas de binaire Mac ARM ; le .star sert aux deux systèmes),
# puis joint les fichiers à la publication de l'étiquette, aux noms fixes attendus par les liens « dernière version ».
# Déclenché par l'envoi d'une étiquette vX.Y.Z (la version de millennium.toml doit lui correspondre).
# Si une publication en brouillon existe déjà pour l'étiquette (avec ses notes), elle est complétée puis publiée.
name: Publication

# SECOURS seulement : les versions se fabriquent sur les machines (tools/publier.ps1 sur le PC, puis
# tools/publier.sh sur le Mac, dépôt privé). Ce workflow ne part qu'à la main, avec l'étiquette à publier.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Étiquette à publier (ex. v0.2.1)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Compilation Windows (plugin + installeur)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer/src-tauri
      - name: Version de l'étiquette
        run: |
          V=$(grep -m1 '^version' millennium.toml | cut -d'"' -f2)
          [ "v$V" = "$TAG" ] || { echo "millennium.toml indique $V, l'étiquette est $TAG"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bash installer/build.sh
      - name: Fichiers à publier
        run: |
          mkdir -p out
          cp "installer/dist/Installer Steam Upgraded ${TAG#v}.exe" out/Steam-Upgraded-Setup.exe
          cp installer/payload/com.venacity.steamupgraded.star out/
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: out/
          if-no-files-found: error

  macos:
    name: Compilation Mac (installeur)
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer/src-tauri
      - uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: windows
      - name: Plugin compilé sur Windows
        run: |
          mkdir -p installer/payload
          cp windows/com.venacity.steamupgraded.star installer/payload/
      - run: SU_STAR_READY=1 bash installer/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: installer/dist/Steam-Upgraded-macOS.zip
          if-no-files-found: error

  publish:
    name: Publication
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Millennium pour Mac (archive de millennium.lock.json, empreinte vérifiée)
        run: |
          URL=$(jq -r .macos.url millennium.lock.json)
          SHA=$(jq -r .macos.sha256 millennium.lock.json)
          F="out/$(basename "$URL")"
          curl -fsSL "$URL" -o "$F"
          echo "$SHA  $F" | sha256sum -c -
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          sha256sum out/*
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" out/* --title "Steam Upgraded ${TAG#v}" --generate-notes --latest
          fi
