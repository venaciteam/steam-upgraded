<!doctype html>
<html lang="fr">
<head>

<title>Installer Steam Upgraded</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="win sq">
  <header class="tb" data-tauri-drag-region>
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-tauri-drag-region><rect x="1" y="1" width="22" height="22" rx="7" class="logo-bg"></rect><path d="M7 14l5-5 5 5" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="logo-fg"></path></svg>
    <span class="tb-name" data-tauri-drag-region>Steam Upgraded</span>
    <span class="tb-sub" id="tb-sub" data-tauri-drag-region>Installation</span>

      <button type="button" class="dot dot-min" id="btn-min" aria-label="Réduire"></button>
      <button type="button" class="dot dot-close" id="btn-close" aria-label="Fermer"></button>

  </header>
  <main id="screen" class="screen" aria-live="polite"></main>
  <div id="modal-root"></div>
